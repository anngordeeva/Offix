<section class="section contacts">
  <div class="container container-grid contacts__container">
    <div class="contacts__wrapper color">
      <h1 class="contacts__title">Contact</h1>
      <p class="contacts__description">
        Reach out for inquiries, collaborations, or just to say hello. We're eager to connect!
      </p>
      <button class="contacts__button">Get in touch</button>
    </div>

    <div class="contacts__wrapper">
      <ul class="contacts__list">
        <li class="contacts__item">
          <span class="section__title">contact us</span>
          <ul class="contacts__item-list">
            <li>
              <a href="tel:+71234567890">+7(123)456-78-90</a>
            </li>
            <li>
              <a href="mailto:helloworld@company.com">helloworld@company.com</a>
            </li>
          </ul>
        </li>

        <li class="contacts__item">
          <span class="section__title">location</span>
          <ul class="contacts__item-list">
            <li>
              3202, HDS Business Centre, Cluster M - JLT, Dubai - UAE
            </li>
          </ul>
        </li>

        <li class="contacts__item">
          <ul class="contacts__social-list">
            <li class="contacts__social-item">
              <a href="https://www.facebook.com" class="contacts__social-link" target="_blank">
                <img src="/src/shared/assets/icons/InstagramLogo.svg" alt="instagram" />
              </a>
            </li>
            <li class="contacts__social-item">
              <a href="https://www.facebook.com" class="contacts__social-link" target="_blank">
                <img src="/src/shared/assets/icons/TelegramLogo.svg" alt="telegram" />
              </a>
            </li>
            <li class="contacts__social-item">
              <a href="https://www.facebook.com" class="contacts__social-link" target="_blank">
                <img src="/src/shared/assets/icons/WhatsappLogo.svg" alt="whatsapp" />
              </a>
            </li>
          </ul>
        </li>
      </ul>

      <div class="contacts__map">
        <img src="/src/shared/assets/images/map.png" alt="map" />
      </div>
    </div>
  </div>
</section>
